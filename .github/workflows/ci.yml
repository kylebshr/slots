name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Newest swift-syntax
            os: xcode-27
            xcode: "27.2"
          - name: Oldest swift-syntax
            os: macos-15
            xcode: "16.0"
            swift-syntax: "510.0.0"

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_${{ matrix.xcode }}.app

      - name: Pin swift-syntax
        if: matrix.swift-syntax
        run: |
          swift package resolve
          swift package resolve swift-syntax --version ${{ matrix.swift-syntax }}

      - name: Build
        run: swift build

      - name: Test
        run: swift test
